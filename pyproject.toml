[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager"
dynamic = ["version"]
description = "A command-line app for assigning and tracking team tasks, with hashed passwords and progress reports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Karabo Levy Khuthama" }]
keywords = ["task-manager", "cli", "python", "productivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff~=0.16.9"]

[project.scripts]
task-manager = "taskmanager.cli:main"

[tool.setuptools]
packages = ["taskmanager"]

[tool.setuptools.dynamic]
version = { attr = "taskmanager.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so a new ruff release can't change the rules under CI.
select = ["E", "F", "W", "I", "B", "UP"]
